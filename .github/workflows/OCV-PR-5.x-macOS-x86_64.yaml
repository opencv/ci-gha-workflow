name: OCV PR:5.x macOS x86_64

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-5.x-macOS-x86_64.yaml'
  workflow_call:

concurrency:
  group: OCV-PR-5.x-macOS-x86_64-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTRA_CMAKE_OPTIONS: '-DBUILD_DOCS=ON -DPYTHON_DEFAULT_EXECUTABLE=/usr/bin/python3 -DOPENCV_DOWNLOAD_PATH=$BINARIES_CACHE -DBUILD_EXAMPLES=ON -DOPENCV_ENABLE_NONFREE=ON -DBUILD_ZLIB=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
  PR_AUTHOR: ${{ github.event.pull_request.head.repo.owner.login }}
  PR_AUTHOR_FORK: ${{ github.event.pull_request.head.repo.full_name }}
  SOURCE_BRANCH_NAME: ${{ github.head_ref }}
  TARGET_BRANCH_NAME: ${{ github.base_ref }}
  ANT_HOME: '/usr/share/ant'
  PYTHONPATH: '${{ github.workspace }}/build/python_loader:$PYTHONPATH'
  OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
  OPENCV_TEST_REQUIRE_DATA: 1
  OPENCV_TEST_CHECK_OPTIONAL_DATA: 1
  # The runner has 12 logical CPUs: four test processes use three OpenCV threads each.
  OPENCV_FOR_THREADS_NUM: 3

jobs:
  BuildAndTest:
    runs-on: opencv-cn-mac-x86-64
    defaults:
      run:
        shell: bash
    steps:
    - name: Brief system information
      timeout-minutes: 60
      run: bash $GIT_CACHE/print_system_information.sh
    - name: Setup infra environment
      timeout-minutes: 60
      if: ${{ github.event.repository.name == 'ci-gha-workflow' }}
      run: |
        echo "TARGET_BRANCH_NAME=5.x" >> "$GITHUB_ENV"
    - name: Set up ccache
      run: |
        cache_dir="$HOME/Library/Caches/ccache"
        mkdir -p "$cache_dir"
        echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
        export CCACHE_DIR="$cache_dir"
        ccache --version
        ccache --max-size=10G
        ccache --zero-stats
        ccache --show-stats
    - name: PR info
      timeout-minutes: 60
      run: |
        echo "PR Author: ${{ env.PR_AUTHOR }}"
        echo "PR Author fork: ${{ env.PR_AUTHOR_FORK }}"
        echo "Source branch name: ${{ env.SOURCE_BRANCH_NAME }}"
        echo "Target branch name: ${{ env.TARGET_BRANCH_NAME }}"
    - name: Clean
      timeout-minutes: 60
      run: find . -mindepth 1 -delete
      working-directory: ${{ github.workspace }}
    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: ${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || 'main' }}
        path: ci-gha-workflow
    - name: Fetch opencv
      timeout-minutes: 60
      run: git clone --branch ${{ env.TARGET_BRANCH_NAME }} --reference $GIT_CACHE/opencv.git https://github.com/opencv/opencv.git
      working-directory: ${{ github.workspace }}
    - name: Merge opencv with ${{ env.SOURCE_BRANCH_NAME }} branch
      timeout-minutes: 60
      if: ${{ github.event.repository.name != 'ci-gha-workflow' }}
      run: git pull -v "https://github.com/${{ env.PR_AUTHOR_FORK }}" "${{ env.SOURCE_BRANCH_NAME }}"
      working-directory: ${{ github.workspace }}/opencv
    - name: Clone opencv_extra
      timeout-minutes: 60
      run: git clone --single-branch --branch ${{ env.TARGET_BRANCH_NAME }} --reference $GIT_CACHE/opencv_extra.git https://github.com/opencv/opencv_extra.git
      working-directory: ${{ github.workspace }}
    - name: Merge opencv_extra with ${{ env.SOURCE_BRANCH_NAME }} branch
      timeout-minutes: 60
      if: ${{ github.event.repository.name != 'ci-gha-workflow' }}
      run: |
        OPENCV_EXTRA_FORK=$(git ls-remote --heads "https://github.com/${{ env.PR_AUTHOR }}/opencv_extra" "${{ env.SOURCE_BRANCH_NAME }}") || true
        if [[ -n "$OPENCV_EXTRA_FORK" ]]; then
          echo "Merge opencv_extra with ${{ env.SOURCE_BRANCH_NAME }} branch"
          git pull -v "https://github.com/${{ env.PR_AUTHOR }}/opencv_extra" "${{ env.SOURCE_BRANCH_NAME }}"
        else
          echo "No merge since ${{ env.PR_AUTHOR }}/opencv_extra does not have branch ${{ env.SOURCE_BRANCH_NAME }}"
        fi
      working-directory: ${{ github.workspace }}/opencv_extra

    - name: Extra DNN models update
      uses: opencv/ci-gha-workflow/.github/actions/update-dnn-models@main
      timeout-minutes: 60
      with:
        target-branch-name: ${{ env.TARGET_BRANCH_NAME }}

    - name: Configure OpenCV
      timeout-minutes: 60
      run: cmake -B build -G Ninja ${{ env.EXTRA_CMAKE_OPTIONS }} opencv
      working-directory: ${{ github.workspace }}
    - name: Build OpenCV
      timeout-minutes: 100
      id: build-opencv
      run: ninja -j $PARALLEL_JOBS | tee ${{ github.workspace }}/build/build-log.txt
      working-directory: ${{ github.workspace }}/build
    - name: ccache statistics
      if: ${{ always() }}
      run: ccache --show-stats
    - name: Warnings check
      timeout-minutes: 60
      run: python3 $GIT_CACHE/warnings-handling.py
      working-directory: ${{ github.workspace }}/build
    - name: Run OpenCV C++ tests
      if: ${{ !cancelled() && steps.build-opencv.outcome == 'success' }}
      uses: ./ci-gha-workflow/run-tests
      with:
        workdir: '${{ github.workspace }}'
        builddir: build
        logdir: '${{ github.workspace }}/build'
        scripts_path: ci-gha-workflow/scripts
        plan: test-plan-macos-5.x.json
        suite: "[ 'main' ]"
        filter: "[ 'macos-common' ]"
        options: ${{ github.event.repository.name == 'ci-gha-workflow' && 'infra' || 'default' }}
        timeout: 15
        jobs: 4
        suffix: macos-x86-64_5.x
    - name: Python3
      timeout-minutes: 60
      if: ${{ !cancelled() && steps.build-opencv.outcome == 'success' }}
      run: python3 ../opencv/modules/python/test/test.py --repo ../opencv -v
      working-directory: ${{ github.workspace }}/build
    - name: Java
      timeout-minutes: 60
      id: java-test
      if: ${{ !cancelled() && steps.build-opencv.outcome == 'success' }}
      run: python3 ../opencv/modules/ts/misc/run.py . -a -t java
      working-directory: ${{ github.workspace }}/build
    - name: Save Unit Test Results
      timeout-minutes: 60
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && steps.java-test.outcome == 'success' && steps.build-opencv.outcome == 'success' }}
      with:
        name: junit-html-macos-x86-64
        path: ${{ github.workspace }}/build/java_test/testResults/junit-noframes.html
