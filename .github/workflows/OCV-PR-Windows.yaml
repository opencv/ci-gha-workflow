name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan.json'
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            if [ "${{ github.event.repository.name == 'ci-gha-workflow' }}" = "true" ] ; then
              echo "branches=[ '4.x', '5.x' ]" >> "$GITHUB_OUTPUT"
            else
              echo "branches=[ '${{ github.base_ref }}' ]" >> "$GITHUB_OUTPUT"
            fi

  Windows:
    runs-on: ${{ matrix.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-arm64
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true

        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    env:
      # TEMP (diagnostic, REVERT before merge): switch the parallel backend from
      # ms-concurrency (PPL) to TBB on arm64, to test whether swapping the backend
      # avoids the PPL multithreading race (alternative to the OpenMP swap).
      # BUILD_TBB=ON builds TBB from source (not pre-installed on the runner).
      # Carotene is back to default (ON), so the ONLY change vs baseline is the backend.
      # VERIFY the banner shows "Parallel framework: tbb" — if BUILD_TBB fails on
      # MSVC/ARM64 and it falls back to ms-concurrency, the result is void.
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        ${{ matrix.arch == 'arm64' && '-DWITH_OPENMP=ON' || '' }}
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.arch == 'arm64' && '-DWITH_TBB=ON -DBUILD_TBB=ON' || '' }}
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.arch == 'arm64' && '-DCPU_BASELINE=NEON -DCPU_DISPATCH=NEON -DCMAKE_SYSTEM_PROCESSOR=arm64 -DOPENCV_WORKAROUND_CMAKE_20989=ON' || '' }}
        ${{ matrix.arch == 'x86' && '-DBUILD_opencv_python3=OFF' || '' }}
      MAIN_BUILD_DIR: "${{ (github.event.repository.name != 'opencv_contrib') && 'build' || 'build-contrib' }}"
      OPENCV_FOR_THREADS_NUM: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.head.repo.owner.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    - name: Update extra dnn models
      if: ${{ matrix.arch != 'arm64' }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    - name: Remove MinGW from PATH (ARM64 MSVC build)
      if: ${{ matrix.arch == 'arm64' }}
      shell: bash
      run: echo "PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i '/mingw' | paste -sd ':')" >> "$GITHUB_ENV"

    # TEMP (diagnostic, REVERT before merge): drop an FPCR probe test into core/test
    # (auto-globbed into opencv_test_core). It reads the ARM64 FP control register on
    # the main thread vs inside cv::parallel_for_ workers. If they differ, worker
    # threads are running with a different FP register state than the main thread.
    - name: (TEMP) Add FPCR probe test
      if: ${{ matrix.arch == 'arm64' }}
      shell: bash
      working-directory: '${{ github.workspace }}'
      run: |
        cat > opencv/modules/core/test/test_fpcr_probe.cpp <<'EOF'
        #include "test_precomp.hpp"
        #if defined(_M_ARM64)
        #include <intrin.h>
        #endif
        #include <mutex>
        #include <set>
        namespace opencv_test { namespace {
        TEST(FPCRProbe, main_vs_worker)
        {
        #if defined(_M_ARM64)
        #ifndef ARM64_FPCR
        #define ARM64_FPCR ARM64_SYSREG(3,3,4,4,0)
        #endif
        uint64_t fpcr_main = (uint64_t)_ReadStatusReg(ARM64_FPCR);
        std::mutex mtx; std::set<uint64_t> worker;
        cv::setNumThreads(4);
        cv::parallel_for_(cv::Range(0, 512), [&](const cv::Range& r){
            volatile double s=0; for(int i=r.start;i<r.end;i++) for(int k=0;k<3000;k++) s+=k*0.5;
            uint64_t f=(uint64_t)_ReadStatusReg(ARM64_FPCR);
            std::lock_guard<std::mutex> lk(mtx); worker.insert(f); (void)s;
        }, 512.0);
        printf("=== FPCR PROBE ===\n");
        printf("FPCR main   = 0x%016llx\n",(unsigned long long)fpcr_main);
        for(uint64_t f: worker) printf("FPCR worker = 0x%016llx\n",(unsigned long long)f);
        printf("distinct_worker_FPCR=%zu MATCH_MAIN=%s\n",worker.size(),
               (worker.size()==1 && *worker.begin()==fpcr_main)?"yes":"NO_OR_MULTIPLE");
        #else
        printf("FPCRProbe: not ARM64\n");
        #endif
        }
        }}
        EOF
        echo "wrote probe:"; ls -l opencv/modules/core/test/test_fpcr_probe.cpp

    - if: ${{ github.event.repository.name != 'opencv_contrib' }}
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    # TEMP (diagnostic, REVERT before merge): skip the contrib build for faster
    # experiment iteration. The "Run OpenCV tests" step below uses MAIN_BUILD_DIR
    # ('build', not 'build-contrib') for a non-opencv_contrib PR, so contrib isn't
    # exercised by the test run anyway.
    - if: false
      name: Configure and build OpenCV with contrib
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build-contrib'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    - name: Run OpenCV tests
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        OPENCV_TEST_CHECK_OPTIONAL_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader;${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/lib/python3'
        OPENCV_OPENCL_RUNTIME: ${{ matrix.arch == 'arm64' && 'disabled' || '' }}
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-${{ matrix.branch }}.json"
        suite: "[ ${{ (github.event.repository.name == 'opencv_contrib') && '''contrib'''  || '''main''' }} ]"
        enable_python: ${{ matrix.cmake_arch == 'x64' }}
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: '${{ matrix.arch }}_${{ matrix.branch }}'
        timeout: 15

    # TEMP (diagnostic, REVERT before merge): confirm the ACTIVE parallel backend
    # (must be openmp for this experiment to be valid) + re-run the FPCR probe.
    - name: (TEMP) Confirm parallel backend + FPCR probe
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ./build/bin/Release/opencv_test_core.exe --gtest_filter='FPCRProbe.*' 2>&1 | tee fpcr_probe.log || true
        echo "==== Parallel framework (MUST say 'tbb' or this experiment is void) ===="
        grep -E "Parallel framework" fpcr_probe.log || true
        echo "==== FPCR summary ===="
        grep -E "FPCR (main|worker)|distinct_worker|MATCH_MAIN" fpcr_probe.log || true

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
