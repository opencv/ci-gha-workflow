name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan-win-*.json'
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string
      fast:
        description: "Run x64 only and skip the compatibility build"
        default: false
        required: false
        type: boolean
      delta:
        description: "Run only full-CI architectures not covered by a completed fast run"
        default: false
        required: false
        type: boolean

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
      configurations: ${{ steps.determine-branches.outputs.configurations }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            if [ "${{ github.event.repository.name == 'ci-gha-workflow' }}" = "true" ] ; then
              echo "branches=[ '4.x', '5.x' ]" >> "$GITHUB_OUTPUT"
            else
              echo "branches=[ '${{ github.base_ref }}' ]" >> "$GITHUB_OUTPUT"
            fi
            if [ "${{ inputs.fast }}" = "true" ]; then
              echo 'configurations=[{"arch":"x64","runner":"opencv-cn-win","vs":"Visual Studio 16 2019","cmake_arch":"x64"}]' >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.delta }}" = "true" ]; then
              echo 'configurations=[{"arch":"x86","runner":"opencv-cn-win","vs":"Visual Studio 16 2019","cmake_arch":"Win32"},{"arch":"arm64","runner":"windows-arm64","vs":"Visual Studio 17 2022","cmake_arch":"ARM64","no_opencl":true},{"arch":"x64","runner":"opencv-cn-win","vs":"Visual Studio 16 2019","cmake_arch":"x64","compat_only":true}]' >> "$GITHUB_OUTPUT"
            else
              echo 'configurations=[{"arch":"x86","runner":"opencv-cn-win","vs":"Visual Studio 16 2019","cmake_arch":"Win32"},{"arch":"x64","runner":"opencv-cn-win","vs":"Visual Studio 16 2019","cmake_arch":"x64"},{"arch":"arm64","runner":"windows-arm64","vs":"Visual Studio 17 2022","cmake_arch":"ARM64","no_opencl":true}]' >> "$GITHUB_OUTPUT"
            fi

  Windows:
    runs-on: ${{ matrix.config.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        config: ${{ fromJSON(needs.branch_eval.outputs.configurations) }}
        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    env:
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.config.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.config.arch == 'x86' && '-DBUILD_opencv_python3=OFF' || '' }}
      MAIN_BUILD_DIR: "${{ (github.event.repository.name != 'opencv_contrib') && 'build' || 'build-contrib' }}"
      OPENCV_FOR_THREADS_NUM: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.head.repo.owner.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    - name: Update extra dnn models
      if: ${{ matrix.config.arch != 'arm64' && !matrix.config.compat_only }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    - if: ${{ github.event.repository.name != 'opencv_contrib' && !matrix.config.compat_only }}
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.config.vs }}'
        options: '-A ${{ matrix.config.cmake_arch }} ${{ env.CMAKE_OPT }}'

    - name: Configure and build OpenCV with contrib
      if: ${{ !inputs.fast || github.event.repository.name == 'opencv_contrib' }}
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: "${{ (github.event.repository.name != 'opencv_contrib' && !matrix.config.compat_only) && 'build' || 'build-contrib' }}"
        clean: "${{ (github.event.repository.name != 'opencv_contrib' && !matrix.config.compat_only) && 'false' || 'true' }}"
        generator: '${{ matrix.config.vs }}'
        options: '-A ${{ matrix.config.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    - name: Run OpenCV tests
      if: ${{ !matrix.config.compat_only }}
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: ${{ matrix.config.arch == 'arm64' && '0' || '1' }}
        OPENCV_TEST_CHECK_OPTIONAL_DATA: ${{ matrix.config.arch == 'arm64' && '0' || '1' }}
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader;${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/lib/python3'
        OPENCV_OPENCL_RUNTIME: ${{ matrix.config.arch == 'arm64' && 'disabled' || '' }}
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-${{ matrix.branch }}.json"
        suite: "[ ${{ (github.event.repository.name == 'opencv_contrib') && '''contrib'''  || '''main''' }} ]"
        enable_python: ${{ matrix.config.cmake_arch == 'x64' }}
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: '${{ matrix.config.arch }}_${{ matrix.branch }}'
        timeout: 15
        jobs: "2"
        fail_fast: ${{ inputs.fast }}

    - if: ${{ !cancelled() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
