name: OCV WinPack:5.1.0 W10-ARM64

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-WinPack-5.x-W10-ARM64.yaml'
  workflow_dispatch:

concurrency:
  group: OCV-WinPack-5.1.0-W10-ARM64-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: 5.1.0

jobs:
  Build:
    runs-on: windows-arm64
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      EXTRA_CMAKE_OPTIONS: >-
        -A ARM64
        -DBUILD_SHARED_LIBS=ON
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTS=OFF
        -DBUILD_PERF_TESTS=OFF
        -DINSTALL_CREATE_DISTRIB=ON
        -DINSTALL_PDB=ON
        -DINSTALL_PDB_COMPONENT_EXCLUDE_FROM_ALL=OFF
        -DOPENCV_GENERATE_SETUPVARS=ON
        -DBUILD_opencv_java=OFF
        -DBUILD_opencv_python2=OFF
        -DBUILD_opencv_python3=ON
        -DOPENCV_PYTHON_INSTALL_PATH=python
        -DBUILD_EXAMPLES=OFF
        -DBUILD_DOCS=OFF
        -DWITH_FFMPEG=OFF
        -DWITH_OPENCL=OFF
        -DWITH_OPENMP=OFF
        -DCPU_BASELINE=NEON
        -DCPU_DISPATCH=NEON
        -DCMAKE_SYSTEM_PROCESSOR=arm64
        -DOPENCV_WORKAROUND_CMAKE_20989=ON

    steps:
    # $GITHUB_WORKSPACE is a backslash Windows path; word-split unquoted (as
    # EXTRA_CMAKE_OPTIONS must be, to become separate -D flags) bash strips
    # each backslash as an escape char instead of treating it as a separator,
    # corrupting the path. cygpath -m gives a drive-letter/forward-slash form
    # that's safe both quoted and unquoted.
    - name: Propagate environment
      run: echo "WORKSPACE=$(cygpath -m "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

    - name: Clean
      run: rm -rf "${{ env.WORKSPACE }}"/* "${{ env.WORKSPACE }}"/install

    # scripts/warnings-handling.py (and any other repo-local tooling) needs
    # this repo's own content checked out -- nothing does that automatically.
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    # Reuse registered ARM64 interpreters or install missing versions.
    # All-user installation requires an elevated runner service account.
    - name: Install ARM64 Python versions
      shell: powershell
      timeout-minutes: 30
      run: |
        $ErrorActionPreference = 'Stop'
        Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue

        function Find-Arm64Python($minorVersion, $preferredDirectory) {
          $directories = @($preferredDirectory)
          # The installer may reuse an existing location instead of TargetDir.
          foreach ($registryRoot in @('HKCU:\Software\Python\PythonCore', 'HKLM:\Software\Python\PythonCore', 'HKLM:\Software\WOW6432Node\Python\PythonCore')) {
            foreach ($key in (Get-ChildItem $registryRoot -ErrorAction SilentlyContinue)) {
              $installPath = Get-Item (Join-Path $key.PSPath 'InstallPath') -ErrorAction SilentlyContinue
              if ($installPath) {
                $directories += $installPath.GetValue('')
              }
            }
          }
          $tag = $minorVersion.Replace('.', '')
          $directories += @("C:\Python\$minorVersion", "$env:ProgramFiles\Python$tag-arm64", "$env:LOCALAPPDATA\Programs\Python\Python$tag-arm64")
          foreach ($directory in ($directories | Where-Object { $_ } | Select-Object -Unique)) {
            $candidate = Join-Path $directory 'python.exe'
            if (!(Test-Path $candidate)) { continue }
            try {
              $prefix = & $candidate -I -c "import platform, sys; print(sys.prefix if platform.machine().upper() == 'ARM64' and '.'.join(map(str, sys.version_info[:2])) == '$minorVersion' else '')" 2>$null
              if ($LASTEXITCODE -eq 0 -and $prefix) { return ($prefix.Trim() -replace '\\', '/') }
            } catch { continue }
          }
          return $null
        }

        $versions = @(
          @{ Version = '3.11.9';  Directory = 'C:\Python\3.11' },
          @{ Version = '3.12.10'; Directory = 'C:\Program Files\Python312-arm64' },
          @{ Version = '3.13.9';  Directory = 'C:\Python\3.13' },
          @{ Version = '3.14.0';  Directory = 'C:\Python\3.14' }
        )

        foreach ($item in $versions) {
          $version = $item.Version
          $directory = $item.Directory
          $minorVersion = ($version.Split('.')[0..1] -join '.')
          $prefix = Find-Arm64Python $minorVersion $directory

          if (!$prefix) {
            $installer = Join-Path $env:RUNNER_TEMP "python-$version-arm64.exe"
            $log = Join-Path $env:RUNNER_TEMP "python-$version-install.log"
            Invoke-WebRequest "https://www.python.org/ftp/python/$version/python-$version-arm64.exe" -OutFile $installer

            $arguments = "/quiet /log `"$log`" InstallAllUsers=1 TargetDir=`"$directory`" Include_pip=1 Include_dev=1 Include_test=0 Include_launcher=0 PrependPath=0"
            $process = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
              throw "Python $version installation failed: $($process.ExitCode)"
            }
            $prefix = Find-Arm64Python $minorVersion $directory
            if (!$prefix) {
              Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
              throw "Installer exited $($process.ExitCode), but no usable ARM64 Python $minorVersion was found"
            }
          }

          $python = "$prefix/python.exe"
          $tag = $minorVersion.Replace('.', '')
          foreach ($required in @("$prefix/include/Python.h", "$prefix/libs/python$tag.lib")) {
            if (!(Test-Path $required)) { throw "Python development file is missing: $required" }
          }
          Write-Host "Using Python $minorVersion at $python"
          "PYTHON${tag}_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python -c "import platform, sys; print(sys.version); print(platform.machine()); assert platform.machine().upper() == 'ARM64'; assert '.'.join(map(str, sys.version_info[:2])) == '$minorVersion'"
          if ($LASTEXITCODE -ne 0) {
            throw "Python $version ARM64 verification failed"
          }
        }

    # numpy headers are required to generate the cv2 bindings. OpenCVDetectPython.cmake's
    # numpy probe (execute_process running "import numpy") fails completely silently, so a
    # pip success here doesn't guarantee CMake's later re-invocation of this same python.exe
    # can actually import it (e.g. pip falling back to a per-user install CMake's subprocess
    # doesn't see). Importing it back out immediately turns a silent failure into a loud one.
    - name: Install numpy
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="${PYTHON312_ROOT}/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"
        echo "PYTHON312_NUMPY=$("$PY" -c "import numpy; print(numpy.get_include().replace(chr(92), chr(47)))")" >> "$GITHUB_ENV"

    # No limited-API build here (matches the old x64 WinPack template): every
    # target Python version gets its own compiled cv2 extension. Missing
    # interpreters are installed above before NumPy and CMake use these paths.
    - name: Install numpy for 3.11
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="${PYTHON311_ROOT}/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"
        echo "PYTHON311_NUMPY=$("$PY" -c "import numpy; print(numpy.get_include().replace(chr(92), chr(47)))")" >> "$GITHUB_ENV"

    - name: Install numpy for 3.13
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="${PYTHON313_ROOT}/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"
        echo "PYTHON313_NUMPY=$("$PY" -c "import numpy; print(numpy.get_include().replace(chr(92), chr(47)))")" >> "$GITHUB_ENV"

    - name: Install numpy for 3.14
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="${PYTHON314_ROOT}/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"
        echo "PYTHON314_NUMPY=$("$PY" -c "import numpy; print(numpy.get_include().replace(chr(92), chr(47)))")" >> "$GITHUB_ENV"

    - name: Clone opencv
      run: |
        cd "${{ env.WORKSPACE }}"
        git clone --single-branch --depth 1 --branch ${{ env.BRANCH_NAME }} https://github.com/opencv/opencv.git

    - name: Configure OpenCV
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build" && cd "${{ env.WORKSPACE }}/build"
        cmake -G "Visual Studio 17 2022" ${{ env.EXTRA_CMAKE_OPTIONS }} -DCMAKE_INSTALL_PREFIX="${{ env.WORKSPACE }}/install" -DPYTHON3_EXECUTABLE="${PYTHON312_ROOT}/python.exe" -DPYTHON3_INCLUDE_DIR="${PYTHON312_ROOT}/include" -DPYTHON3_LIBRARY="${PYTHON312_ROOT}/libs/python312.lib" -DPYTHON3_NUMPY_INCLUDE_DIRS="${PYTHON312_NUMPY}" "${{ env.WORKSPACE }}/opencv"

    - name: Build and install OpenCV
      run: |
        cd "${{ env.WORKSPACE }}/build"
        cmake --build . --config Release --target install 2>&1 | tee build-log.txt

    # Each extra Python version's cv2 module is built as a separate standalone
    # pass against the already-built OpenCV libs (modules/python/standalone.cmake),
    # matching the old x64 WinPack template. -DOpenCV_BINARY_DIR alone pulls in
    # CMAKE_INSTALL_PREFIX/OPENCV_PYTHON_INSTALL_PATH/OpenCV_SOURCE_DIR from the
    # main build's generated opencv_python_config.cmake (a plain set(), not
    # CACHE, so it overrides any -D of those three unconditionally -- no point
    # passing them here). Only the per-version PYTHON_* vars need overriding
    # (no "3", unlike the main build's PYTHON3_* -- a different code path,
    # entered because OPENCV_INITIAL_PASS isn't defined when cmake targets
    # modules/python directly, so this doesn't hit the world-build python3 gate).
    - name: Configure Python 3.11 bindings
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build/python_311" && cd "${{ env.WORKSPACE }}/build/python_311"
        cmake -G "Visual Studio 17 2022" -A ARM64 -DOpenCV_BINARY_DIR="${{ env.WORKSPACE }}/build" -DPYTHON_EXECUTABLE="${PYTHON311_ROOT}/python.exe" -DPYTHON_INCLUDE_DIR="${PYTHON311_ROOT}/include" -DPYTHON_LIBRARY="${PYTHON311_ROOT}/libs/python311.lib" -DPYTHON_NUMPY_INCLUDE_DIRS="${PYTHON311_NUMPY}" "${{ env.WORKSPACE }}/opencv/modules/python"

    - name: Build and install Python 3.11 bindings
      run: |
        cd "${{ env.WORKSPACE }}/build/python_311"
        cmake --build . --config Release --target install

    - name: Configure Python 3.13 bindings
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build/python_313" && cd "${{ env.WORKSPACE }}/build/python_313"
        cmake -G "Visual Studio 17 2022" -A ARM64 -DOpenCV_BINARY_DIR="${{ env.WORKSPACE }}/build" -DPYTHON_EXECUTABLE="${PYTHON313_ROOT}/python.exe" -DPYTHON_INCLUDE_DIR="${PYTHON313_ROOT}/include" -DPYTHON_LIBRARY="${PYTHON313_ROOT}/libs/python313.lib" -DPYTHON_NUMPY_INCLUDE_DIRS="${PYTHON313_NUMPY}" "${{ env.WORKSPACE }}/opencv/modules/python"

    - name: Build and install Python 3.13 bindings
      run: |
        cd "${{ env.WORKSPACE }}/build/python_313"
        cmake --build . --config Release --target install

    - name: Configure Python 3.14 bindings
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build/python_314" && cd "${{ env.WORKSPACE }}/build/python_314"
        cmake -G "Visual Studio 17 2022" -A ARM64 -DOpenCV_BINARY_DIR="${{ env.WORKSPACE }}/build" -DPYTHON_EXECUTABLE="${PYTHON314_ROOT}/python.exe" -DPYTHON_INCLUDE_DIR="${PYTHON314_ROOT}/include" -DPYTHON_LIBRARY="${PYTHON314_ROOT}/libs/python314.lib" -DPYTHON_NUMPY_INCLUDE_DIRS="${PYTHON314_NUMPY}" "${{ env.WORKSPACE }}/opencv/modules/python"

    - name: Build and install Python 3.14 bindings
      run: |
        cd "${{ env.WORKSPACE }}/build/python_314"
        cmake --build . --config Release --target install

    - name: Warnings check
      continue-on-error: true
      run: python ./scripts/warnings-handling.py "${{ env.WORKSPACE }}/build/build-log.txt"

    - name: Pack WinPack installer (cpp + python)
      run: |
        mkdir "${{ env.WORKSPACE }}/artifacts"
        cd "${{ env.WORKSPACE }}/install"
        "C:/Program Files/7-Zip/7z.exe" a -bd -sfx -y -mx7 ../artifacts/opencv-5.1.0-windows-arm64.exe ./

    - name: Save artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCV-5.1.0-Windows-ARM64
        path: ${{ env.WORKSPACE }}/artifacts/opencv-5.1.0-windows-arm64.exe
