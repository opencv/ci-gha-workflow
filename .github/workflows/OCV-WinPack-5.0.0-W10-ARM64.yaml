name: OCV WinPack:5.0.0 W10-ARM64

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-WinPack-5.0.0-W10-ARM64.yaml'
  workflow_dispatch:

concurrency:
  group: OCV-WinPack-5.0.0-W10-ARM64-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: 5.0.0

jobs:
  Build:
    runs-on: windows-arm64
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      EXTRA_CMAKE_OPTIONS: >-
        -A ARM64
        -DBUILD_SHARED_LIBS=ON
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTS=OFF
        -DBUILD_PERF_TESTS=OFF
        -DINSTALL_CREATE_DISTRIB=ON
        -DINSTALL_PDB=ON
        -DINSTALL_PDB_COMPONENT_EXCLUDE_FROM_ALL=OFF
        -DOPENCV_GENERATE_SETUPVARS=ON
        -DBUILD_opencv_java=OFF
        -DBUILD_opencv_python2=OFF
        -DOPENCV_PYTHON_INSTALL_PATH=python
        -DBUILD_EXAMPLES=OFF
        -DBUILD_DOCS=OFF
        -DWITH_FFMPEG=OFF
        -DWITH_OPENCL=OFF
        -DWITH_OPENMP=OFF
        -DCPU_BASELINE=NEON
        -DCPU_DISPATCH=NEON
        -DCMAKE_SYSTEM_PROCESSOR=arm64
        -DOPENCV_WORKAROUND_CMAKE_20989=ON

    steps:
    # $GITHUB_WORKSPACE is a backslash Windows path; word-split unquoted (as
    # EXTRA_CMAKE_OPTIONS must be, to become separate -D flags) bash strips
    # each backslash as an escape char instead of treating it as a separator,
    # corrupting the path. cygpath -m gives a drive-letter/forward-slash form
    # that's safe both quoted and unquoted.
    - name: Propagate environment
      run: echo "WORKSPACE=$(cygpath -m "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

    - name: Clean
      run: rm -rf "${{ env.WORKSPACE }}"/* "${{ env.WORKSPACE }}"/install

    # scripts/warnings-handling.py (and any other repo-local tooling) needs
    # this repo's own content checked out -- nothing does that automatically.
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    # 7-Zip isn't preinstalled on this runner (7z: command not found). Install
    # via winget (built into Windows 11) rather than pin a download URL/version.
    # --architecture arm64 forces the native build, not an x64 one under emulation.
    - name: Install 7-Zip
      run: winget install --id 7zip.7zip -e --architecture arm64 --silent --accept-package-agreements --accept-source-agreements

    # numpy headers are required to generate the cv2 bindings; without them
    # CMake silently drops opencv_python3 the same way it dropped it when the
    # interpreter itself wasn't found.
    - name: Install numpy
      run: '"C:/Program Files/Python312-arm64/python.exe" -m pip install numpy'

    - name: Clone opencv
      run: |
        cd "${{ env.WORKSPACE }}"
        git clone --single-branch --depth 1 --branch ${{ env.BRANCH_NAME }} https://github.com/opencv/opencv.git

    - name: Configure OpenCV
      run: |
        mkdir "${{ env.WORKSPACE }}/build" && cd "${{ env.WORKSPACE }}/build"
        cmake -G "Visual Studio 17 2022" ${{ env.EXTRA_CMAKE_OPTIONS }} -DCMAKE_INSTALL_PREFIX="${{ env.WORKSPACE }}/install" -DPYTHON3_EXECUTABLE="C:/Program Files/Python312-arm64/python.exe" "${{ env.WORKSPACE }}/opencv"

    - name: Build and install OpenCV
      run: |
        cd "${{ env.WORKSPACE }}/build"
        cmake --build . --config Release --target install 2>&1 | tee build-log.txt

    - name: Warnings check
      continue-on-error: true
      run: python ./scripts/warnings-handling.py "${{ env.WORKSPACE }}/build/build-log.txt"

    - name: Pack WinPack installer (cpp + python)
      run: |
        mkdir "${{ env.WORKSPACE }}/artifacts"
        cd "${{ env.WORKSPACE }}/install"
        "C:/Program Files/7-Zip/7z.exe" a -bd -sfx -y -mx7 ../artifacts/opencv-5.0.0-windows-arm64.exe ./

    - name: Save artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCV-5.0.0-Windows-ARM64
        path: ${{ env.WORKSPACE }}/artifacts/opencv-5.0.0-windows-arm64.exe
