name: OCV WinPack:5.0.0 W10-ARM64

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-WinPack-5.0.0-W10-ARM64.yaml'
  workflow_dispatch:

concurrency:
  group: OCV-WinPack-5.0.0-W10-ARM64-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: 5.0.0

jobs:
  Build:
    runs-on: windows-11-vs2026-arm
    defaults:
      run:
        shell: bash
    env:
      # ARM64-only fixes validated in https://github.com/opencv/ci-gha-workflow/pull/273:
      #  - CMAKE_ASM_COMPILER-NOTFOUND: runner has C:\mingw64 on PATH, CMake else picks
      #    MinGW's cc.exe as ASM compiler and emits GNU-style link flags MSVC rejects.
      #  - WITH_OPENMP=ON: default MS-Concurrency/PPL backend has a concurrency bug on
      #    MSVC/ARM64 (fails Core_Rand.parallel_for_stable_results + imgproc/G-API tests).
      #  - WITH_TBB stays OFF: bundled 3rdparty/tbb's WIN32-AND-NOT-ARM guard is inverted
      #    for AArch64 and hard-errors on this exact platform.
      EXTRA_CMAKE_OPTIONS: >-
        -A ARM64
        -DCMAKE_ASM_COMPILER=CMAKE_ASM_COMPILER-NOTFOUND
        -DWITH_OPENMP=ON
        -DWITH_OPENCL=OFF
        -DWITH_TBB=OFF
        -DWITH_LAPACK=OFF
        -DBUILD_opencv_java=OFF
        -DBUILD_SHARED_LIBS=ON
        -DBUILD_TESTS=OFF
        -DBUILD_PERF_TESTS=OFF
        -DBUILD_EXAMPLES=OFF
        -DBUILD_DOCS=OFF
        -DINSTALL_PDB=ON
        -DINSTALL_CREATE_DISTRIB=ON
        -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
        -DCMAKE_BUILD_TYPE=Release
        # -- add your own custom options below --

    steps:
    - name: Clean
      run: rm -rf "${{ github.workspace }}"/* "${{ github.workspace }}"/install

    - name: Clone opencv
      run: |
        cd "${{ github.workspace }}"
        git clone --single-branch --branch ${{ env.BRANCH_NAME }} https://github.com/opencv/opencv.git

    - name: Configure OpenCV
      run: |
        mkdir "${{ github.workspace }}/build" && cd "${{ github.workspace }}/build"
        cmake -G "Visual Studio 18 2026" ${{ env.EXTRA_CMAKE_OPTIONS }} "${{ github.workspace }}/opencv"

    - name: Build and install OpenCV
      run: |
        cd "${{ github.workspace }}/build"
        cmake --build . --config Release --target install -- /maxcpucount /consoleloggerparameters:NoSummary 2>&1 | tee build-log.txt

    - name: Warnings check
      run: python3 ./scripts/warnings-handling.py "${{ github.workspace }}/build/build-log.txt"

    - name: Pack shared libs
      run: |
        mkdir "${{ github.workspace }}/artifacts"
        cd "${{ github.workspace }}/install"
        7z a -bd -t7z -y -mx7 ../artifacts/opencv-5.0.0-win-arm64.7z ./

    - name: Save artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCV-5.0.0-Win-ARM64
        path: ${{ github.workspace }}/artifacts/opencv-5.0.0-win-arm64.7z
