name: OCV WinPack:5.0.0 W10-ARM64

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-WinPack-5.0.0-W10-ARM64.yaml'
  workflow_dispatch:

concurrency:
  group: OCV-WinPack-5.0.0-W10-ARM64-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: 5.0.0

jobs:
  Build:
    runs-on: windows-arm64
    defaults:
      run:
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      EXTRA_CMAKE_OPTIONS: >-
        -A ARM64
        -DBUILD_SHARED_LIBS=ON
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTS=OFF
        -DBUILD_PERF_TESTS=OFF
        -DINSTALL_CREATE_DISTRIB=ON
        -DINSTALL_PDB=ON
        -DINSTALL_PDB_COMPONENT_EXCLUDE_FROM_ALL=OFF
        -DOPENCV_GENERATE_SETUPVARS=ON
        -DBUILD_opencv_java=OFF
        -DBUILD_opencv_python2=OFF
        -DBUILD_opencv_python3=ON
        -DOPENCV_PYTHON_INSTALL_PATH=python
        -DBUILD_EXAMPLES=OFF
        -DBUILD_DOCS=OFF
        -DWITH_FFMPEG=OFF
        -DWITH_OPENCL=OFF
        -DWITH_OPENMP=OFF
        -DCPU_BASELINE=NEON
        -DCPU_DISPATCH=NEON
        -DCMAKE_SYSTEM_PROCESSOR=arm64
        -DOPENCV_WORKAROUND_CMAKE_20989=ON

    steps:
    # $GITHUB_WORKSPACE is a backslash Windows path; word-split unquoted (as
    # EXTRA_CMAKE_OPTIONS must be, to become separate -D flags) bash strips
    # each backslash as an escape char instead of treating it as a separator,
    # corrupting the path. cygpath -m gives a drive-letter/forward-slash form
    # that's safe both quoted and unquoted.
    - name: Propagate environment
      run: echo "WORKSPACE=$(cygpath -m "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

    - name: Clean
      run: rm -rf "${{ env.WORKSPACE }}"/* "${{ env.WORKSPACE }}"/install

    # scripts/warnings-handling.py (and any other repo-local tooling) needs
    # this repo's own content checked out -- nothing does that automatically.
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    # numpy headers are required to generate the cv2 bindings. OpenCVDetectPython.cmake's
    # numpy probe (execute_process running "import numpy") fails completely silently, so a
    # pip success here doesn't guarantee CMake's later re-invocation of this same python.exe
    # can actually import it (e.g. pip falling back to a per-user install CMake's subprocess
    # doesn't see). Importing it back out immediately turns a silent failure into a loud one.
    - name: Install numpy
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="C:/Program Files/Python312-arm64/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"

    # No limited-API build here (matches the old x64 WinPack template): every
    # target Python version gets its own compiled cv2 extension. 3.11/3.13/3.14
    # are provisioned directly on the runner at C:\Python\<ver>\ (in-job winget
    # installs hit MSI error 1603 consistently regardless of scope/location --
    # this box blocks installers outright), so we just reference them, same as
    # every other Windows workflow in this repo does for its own Python setup.
    - name: Install numpy for 3.11
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="C:/Python/3.11/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"

    - name: Install numpy for 3.13
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="C:/Python/3.13/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"

    - name: Install numpy for 3.14
      run: |
        unset PYTHONHOME PYTHONPATH
        PY="C:/Python/3.14/python.exe"
        "$PY" -m pip install --no-cache-dir numpy
        "$PY" -c "import numpy; print('numpy', numpy.__version__, 'at', numpy.get_include())"

    - name: Clone opencv
      run: |
        cd "${{ env.WORKSPACE }}"
        git clone --single-branch --depth 1 --branch ${{ env.BRANCH_NAME }} https://github.com/opencv/opencv.git

    - name: Configure OpenCV
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build" && cd "${{ env.WORKSPACE }}/build"
        cmake -G "Visual Studio 17 2022" ${{ env.EXTRA_CMAKE_OPTIONS }} -DCMAKE_INSTALL_PREFIX="${{ env.WORKSPACE }}/install" -DPYTHON3_EXECUTABLE="C:/Program Files/Python312-arm64/python.exe" -DPYTHON3_INCLUDE_DIR="C:/Program Files/Python312-arm64/include" -DPYTHON3_LIBRARY="C:/Program Files/Python312-arm64/libs/python312.lib" -DPYTHON3_NUMPY_INCLUDE_DIRS="C:/Program Files/Python312-arm64/Lib/site-packages/numpy/_core/include" "${{ env.WORKSPACE }}/opencv"

    - name: Build and install OpenCV
      run: |
        cd "${{ env.WORKSPACE }}/build"
        cmake --build . --config Release --target install 2>&1 | tee build-log.txt

    # Each extra Python version's cv2 module is built as a separate standalone
    # pass against the already-built OpenCV libs (modules/python/standalone.cmake),
    # not by reconfiguring the whole project. That file uses PYTHON_* variable
    # names (no "3"), unlike the main build's PYTHON3_* -- different code path,
    # entered because OPENCV_INITIAL_PASS isn't defined when cmake targets
    # modules/python directly, so this doesn't hit the world-build python3 gate.
    - name: Configure Python 3.11 bindings
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build/python_311" && cd "${{ env.WORKSPACE }}/build/python_311"
        cmake -G "Visual Studio 17 2022" -A ARM64 -DOpenCV_BINARY_DIR="${{ env.WORKSPACE }}/build" -DOpenCV_SOURCE_DIR="${{ env.WORKSPACE }}/opencv" -DCMAKE_INSTALL_PREFIX="${{ env.WORKSPACE }}/install" -DOPENCV_PYTHON_INSTALL_PATH=python -DPYTHON_EXECUTABLE="C:/Python/3.11/python.exe" -DPYTHON_INCLUDE_DIR="C:/Python/3.11/include" -DPYTHON_LIBRARY="C:/Python/3.11/libs/python311.lib" -DPYTHON_NUMPY_INCLUDE_DIRS="C:/Python/3.11/Lib/site-packages/numpy/_core/include" "${{ env.WORKSPACE }}/opencv/modules/python"

    - name: Build and install Python 3.11 bindings
      run: |
        cd "${{ env.WORKSPACE }}/build/python_311"
        cmake --build . --config Release --target install

    - name: Configure Python 3.13 bindings
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build/python_313" && cd "${{ env.WORKSPACE }}/build/python_313"
        cmake -G "Visual Studio 17 2022" -A ARM64 -DOpenCV_BINARY_DIR="${{ env.WORKSPACE }}/build" -DOpenCV_SOURCE_DIR="${{ env.WORKSPACE }}/opencv" -DCMAKE_INSTALL_PREFIX="${{ env.WORKSPACE }}/install" -DOPENCV_PYTHON_INSTALL_PATH=python -DPYTHON_EXECUTABLE="C:/Python/3.13/python.exe" -DPYTHON_INCLUDE_DIR="C:/Python/3.13/include" -DPYTHON_LIBRARY="C:/Python/3.13/libs/python313.lib" -DPYTHON_NUMPY_INCLUDE_DIRS="C:/Python/3.13/Lib/site-packages/numpy/_core/include" "${{ env.WORKSPACE }}/opencv/modules/python"

    - name: Build and install Python 3.13 bindings
      run: |
        cd "${{ env.WORKSPACE }}/build/python_313"
        cmake --build . --config Release --target install

    - name: Configure Python 3.14 bindings
      run: |
        unset PYTHONHOME PYTHONPATH
        mkdir "${{ env.WORKSPACE }}/build/python_314" && cd "${{ env.WORKSPACE }}/build/python_314"
        cmake -G "Visual Studio 17 2022" -A ARM64 -DOpenCV_BINARY_DIR="${{ env.WORKSPACE }}/build" -DOpenCV_SOURCE_DIR="${{ env.WORKSPACE }}/opencv" -DCMAKE_INSTALL_PREFIX="${{ env.WORKSPACE }}/install" -DOPENCV_PYTHON_INSTALL_PATH=python -DPYTHON_EXECUTABLE="C:/Python/3.14/python.exe" -DPYTHON_INCLUDE_DIR="C:/Python/3.14/include" -DPYTHON_LIBRARY="C:/Python/3.14/libs/python314.lib" -DPYTHON_NUMPY_INCLUDE_DIRS="C:/Python/3.14/Lib/site-packages/numpy/_core/include" "${{ env.WORKSPACE }}/opencv/modules/python"

    - name: Build and install Python 3.14 bindings
      run: |
        cd "${{ env.WORKSPACE }}/build/python_314"
        cmake --build . --config Release --target install

    - name: Warnings check
      continue-on-error: true
      run: python ./scripts/warnings-handling.py "${{ env.WORKSPACE }}/build/build-log.txt"

    - name: Pack WinPack installer (cpp + python)
      run: |
        mkdir "${{ env.WORKSPACE }}/artifacts"
        cd "${{ env.WORKSPACE }}/install"
        "C:/Program Files/7-Zip/7z.exe" a -bd -sfx -y -mx7 ../artifacts/opencv-5.0.0-windows-arm64.exe ./

    - name: Save artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCV-5.0.0-Windows-ARM64
        path: ${{ env.WORKSPACE }}/artifacts/opencv-5.0.0-windows-arm64.exe
