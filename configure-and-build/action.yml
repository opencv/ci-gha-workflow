name: configure-and-build
description: "Build OpenCV using CMake"

inputs:
  workdir:
    description: "Work directory on executor, repositories will be cloned to opencv/opencv_contrib/opencv_extra"
  builddir:
    description: "Build directory"
    default: "build"
  generator:
    description: "CMake generator, e.g. Ninja"
  options:
    description: "Extra CMake options"
  clean:
    description: "Remove the build directory before configuring"
    default: "true"

runs:
  using: "composite"
  steps:

    - if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        ccache --show-stats > /tmp/opencv-ccache-stats-before.txt
        {
          echo "### Runner: $RUNNER_NAME"
          echo "- OS/architecture: $RUNNER_OS / $RUNNER_ARCH"
          echo "- Build directory: ${{ inputs.builddir }}"
          echo "- CPU count: $(nproc)"
          echo "- Load before build: $(uptime)"
        } >> "$GITHUB_STEP_SUMMARY"

    - working-directory: ${{ inputs.workdir }}
      shell: bash
      run: |
        echo "::group::Configure"
        if [ '${{ inputs.clean }}' = 'true' ]; then
          rm -rf '${{ inputs.builddir }}'
        elif [ ! -d '${{ inputs.builddir }}' ]; then
          echo "::error::Cannot reuse missing build directory: ${{ inputs.builddir }}"
          exit 1
        fi
        mkdir -p '${{ inputs.builddir }}'
        cmake \
          -S opencv \
          -B '${{ inputs.builddir }}' \
          -G '${{ inputs.generator }}' \
          ${{ inputs.options }}
        echo "::endgroup::"

    - working-directory: ${{ inputs.workdir }}
      shell: bash
      run: |
        set -x
        echo "::group::Build"
        if [ "$RUNNER_OS" == "Windows" ]; then
          cfg="--config Release"
        fi
        cmake --build '${{ inputs.builddir }}' ${cfg} 2>&1 | tee '${{ inputs.builddir }}/log.txt'
        echo "::endgroup::"

    - shell: bash
      run: |
        pyexe=python3
        if [ "$RUNNER_OS" == "Windows" ]; then
          pyexe=python
        fi
        set +e
        ${pyexe} ./scripts/warnings-handling.py \
          '${{ inputs.workdir }}/${{ inputs.builddir }}/log.txt'
        if [ $? -ne 0 ]; then
          echo "WARNINGS=1" >> $GITHUB_ENV
        fi

    - shell: bash
      run: |
        set -x
        echo "::group::Stat"
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "No statistics on Windows for now"
        else
          ccache --show-stats | tee /tmp/opencv-ccache-stats.txt
          {
            echo '<details><summary>ccache statistics</summary>'
            echo
            echo '**Before build**'
            echo '```text'
            cat /tmp/opencv-ccache-stats-before.txt
            echo '```'
            echo '**After build**'
            echo '```text'
            cat /tmp/opencv-ccache-stats.txt
            echo '```'
            echo '</details>'
            echo "- Load after build: $(uptime)"
            echo "- Filesystem: $(df -h '${{ inputs.workdir }}' | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "::endgroup::"
