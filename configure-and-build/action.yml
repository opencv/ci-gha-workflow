name: configure-and-build
description: "Build OpenCV using CMake"

inputs:
  workdir:
    description: "Work directory on executor, repositories will be cloned to opencv/opencv_contrib/opencv_extra"
  builddir:
    description: "Build directory"
    default: "build"
  generator:
    description: "CMake generator, e.g. Ninja"
  options:
    description: "Extra CMake options"

runs:
  using: "composite"
  steps:

    - if: ${{ runner.os != 'Windows' }}
      shell: bash
      run: |
        ccache --show-stats > /tmp/opencv-ccache-stats-before.txt
        {
          echo "### Runner: $RUNNER_NAME"
          echo "- OS/architecture: $RUNNER_OS / $RUNNER_ARCH"
          echo "- Build directory: ${{ inputs.builddir }}"
          echo "- CPU count: $(nproc)"
          echo "- Load before build: $(uptime)"
        } >> "$GITHUB_STEP_SUMMARY"

    - working-directory: ${{ inputs.workdir }}
      shell: bash
      run: |
        echo "::group::Configure"
        rm -rf '${{ inputs.builddir }}'
        mkdir -p '${{ inputs.builddir }}'
        cmake \
          -S opencv \
          -B '${{ inputs.builddir }}' \
          -G '${{ inputs.generator }}' \
          ${{ inputs.options }}
        echo "::endgroup::"

    - working-directory: ${{ inputs.workdir }}
      shell: bash
      env:
        OCV_BUILD_DIR: ${{ inputs.builddir }}
        OCV_GENERATOR: ${{ inputs.generator }}
      run: |
        set -x
        echo "::group::Build"
        msbuild_args=()
        if [ "$RUNNER_OS" == "Windows" ]; then
          cfg="--config Release"
        fi
        if [[ "$RUNNER_OS" == "Windows" && "$OCV_GENERATOR" == "Visual Studio "* &&
              -n "${CMAKE_BUILD_PARALLEL_LEVEL:-}" ]]; then
          if [[ ! "$CMAKE_BUILD_PARALLEL_LEVEL" =~ ^0*[1-9][0-9]*$ ]]; then
            echo "::error::CMAKE_BUILD_PARALLEL_LEVEL must be a positive decimal integer."
            exit 2
          fi
          # Keep project parallelism separate from the shared compiler budget.
          if compiler_jobs="$(pwsh -NoLogo -NoProfile -NonInteractive -Command '[Environment]::ProcessorCount')"; then
            compiler_jobs="${compiler_jobs//$'\r'/}"
          else
            compiler_jobs=""
          fi
          if [[ ! "$compiler_jobs" =~ ^0*[1-9][0-9]*$ ]]; then
            echo "::warning::Could not determine the available logical processor count; using CMAKE_BUILD_PARALLEL_LEVEL=$CMAKE_BUILD_PARALLEL_LEVEL for the shared compiler budget."
            compiler_jobs="$CMAKE_BUILD_PARALLEL_LEVEL"
          fi
          msbuild_args=(--parallel "$CMAKE_BUILD_PARALLEL_LEVEL" --
            /p:MultiProcCL=true "/p:MultiProcMaxCount=$compiler_jobs"
            /p:EnforceProcessCountAcrossBuilds=true /p:EnableClServerMode=true)
          # Git Bash must not rewrite native MSBuild switches as filesystem paths.
          if [ "${MSYS2_ARG_CONV_EXCL:-}" != "*" ]; then
            export MSYS2_ARG_CONV_EXCL="${MSYS2_ARG_CONV_EXCL:+${MSYS2_ARG_CONV_EXCL};}/p:"
          fi
        fi
        cmake --build "$OCV_BUILD_DIR" ${cfg} "${msbuild_args[@]}" 2>&1 | tee "$OCV_BUILD_DIR/log.txt"
        echo "::endgroup::"

    - shell: bash
      run: |
        pyexe=python3
        if [ "$RUNNER_OS" == "Windows" ]; then
          pyexe=python
        fi
        set +e
        ${pyexe} ./scripts/warnings-handling.py \
          '${{ inputs.workdir }}/${{ inputs.builddir }}/log.txt'
        if [ $? -ne 0 ]; then
          echo "WARNINGS=1" >> $GITHUB_ENV
        fi

    - shell: bash
      run: |
        set -x
        echo "::group::Stat"
        if command -v sccache > /dev/null; then
          sccache --show-stats
        elif [ "$RUNNER_OS" == "Windows" ]; then
          echo "No statistics on Windows for now"
        else
          ccache --show-stats | tee /tmp/opencv-ccache-stats.txt
          {
            echo '<details><summary>ccache statistics</summary>'
            echo
            echo '**Before build**'
            echo '```text'
            cat /tmp/opencv-ccache-stats-before.txt
            echo '```'
            echo '**After build**'
            echo '```text'
            cat /tmp/opencv-ccache-stats.txt
            echo '```'
            echo '</details>'
            echo "- Load after build: $(uptime)"
            echo "- Filesystem: $(df -h '${{ inputs.workdir }}' | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "::endgroup::"
